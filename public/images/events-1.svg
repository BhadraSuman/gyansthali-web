<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="grad_events-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#9D174D" />
    </linearGradient>
    <pattern id="grid_events-1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
      <circle cx="20" cy="20" r="1.5" fill="#FFFFFF" fill-opacity="0.1"/>
    </pattern>
    <filter id="shadow_events-1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#grad_events-1)" />
  <!-- Grid overlay -->
  <rect width="1200" height="800" fill="url(#grid_events-1)" />

  <!-- Ambient light blobs -->
  <circle cx="200" cy="150" r="280" fill="#F43F5E" opacity="0.12" filter="blur(40px)" />
  <circle cx="1000" cy="650" r="320" fill="#831843" opacity="0.2" filter="blur(50px)" />

  <!-- School Crest / Badge Icon at Center Top -->
  <g transform="translate(600, 260)" filter="url(#shadow_events-1)">
    <circle cx="0" cy="0" r="85" fill="#FFFFFF" fill-opacity="0.12" stroke="#F43F5E" stroke-width="3" />
    <circle cx="0" cy="0" r="72" fill="#FFFFFF" fill-opacity="0.95" />
    <!-- Book & Sun Icon -->
    <path d="M -26 -12 C -12 -20 12 -20 26 -12 L 26 22 C 12 14 -12 14 -26 22 Z" fill="#1E3A8A" />
    <circle cx="0" cy="-28" r="8" fill="#F59E0B" />
    <path d="M 0 -22 L 0 -10" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Central Typography Card -->
  <g transform="translate(600, 440)" text-anchor="middle">
    <!-- Category / Placeholder Tag -->
    <rect x="-180" y="-36" width="360" height="34" rx="17" fill="#F43F5E" opacity="0.22" />
    <rect x="-180" y="-36" width="360" height="34" rx="17" fill="none" stroke="#F43F5E" stroke-width="1.5" />
    <text x="0" y="-14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="2">
      PHOTO SLOT: EVENTS-1
    </text>

    <!-- Main Title -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      Annual Day Celebrations
    </text>

    <!-- Subtitle -->
    <text x="0" y="72" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#E2E8F0">
      Cultural Dances, Drama & Music Performances
    </text>

    <!-- Replacement hint -->
    <g transform="translate(0, 140)">
      <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#000000" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
      <text x="0" y="5" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#CBD5E1">
        📷 Drop real photo into <tspan fill="#FDE68A" font-weight="700">/public/images/events-1.jpg</tspan> (1000x700)
      </text>
    </g>
  </g>

  <!-- School Branding Top Left -->
  <g transform="translate(60, 60)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
      GYAN STHALI PUBLIC SCHOOL
    </text>
    <text x="0" y="46" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#F43F5E" letter-spacing="2">
      KALAJHARIA • JHARKHAND
    </text>
  </g>

  <!-- Corner Border Flourish -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#F43F5E" stroke-width="2" opacity="0.6"/>
  <path d="M 1130 40 L 1160 40 L 1160 70" fill="none" stroke="#F43F5E" stroke-width="2" opacity="0.6"/>
  <path d="M 40 730 L 40 760 L 70 760" fill="none" stroke="#F43F5E" stroke-width="2" opacity="0.6"/>
  <path d="M 1130 760 L 1160 760 L 1160 730" fill="none" stroke="#F43F5E" stroke-width="2" opacity="0.6"/>
</svg>